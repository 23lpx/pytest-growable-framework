# 商用短链平台 · link 域 —— GET /link-server/api/domain/v1/list
#
# 契约速记：成功 code=0、msg=null；失败也是 HTTP 200，成败只看 code。
# 由 Excel 用例表转换而来，原始表见项目 docs/。
base_info:
  api_name: link-list
  url: '/link-server/api/domain/v1/list'
  method: GET
  headers:
    'Content-Type': 'application/json'

test_cases:
  - case_name: "域名列表：查询可用域名"
    headers:
      token: "${token}"
    data:
      {}
    validation:
      - contains:
          code: 0
  - case_name: "域名列表：字段结构与类型"
    headers:
      token: "${token}"
    data:
      {}
    validation:
      - contains:
          code: 0
  - case_name: "域名列表：未登录"
    data:
      {}
    validation:
      - contains:
          code: 250004
