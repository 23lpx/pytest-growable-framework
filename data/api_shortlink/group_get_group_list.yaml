# 商用短链平台 · group 域 —— GET /link-server/api/group/v1/list
#
# 契约速记：成功 code=0、msg=null；失败也是 HTTP 200，成败只看 code。
# 由 Excel 用例表转换而来，原始表见项目 docs/。
base_info:
  api_name: group-list
  url: '/link-server/api/group/v1/list'
  method: GET
  headers:
    'Content-Type': 'application/json'

test_cases:
  - case_name: "分组列表：有分组时查询"
    smoke: true
    headers:
      token: "${token}"
    data:
      {}
    validation:
      - contains:
          code: 0
  - case_name: "分组列表：无分组时查询"
    headers:
      token: "${token}"
    data:
      {}
    validation:
      - contains:
          code: 0
  - case_name: "分组列表：排序按 id 倒序"
    headers:
      token: "${token}"
    data:
      {}
    validation:
      - contains:
          code: 0
  - case_name: "分组列表：只返回自己的分组"
    headers:
      token: "${token}"
    data:
      {}
    validation:
      - contains:
          code: 0
  - case_name: "分组列表：Long 字段序列化为字符串"
    headers:
      token: "${token}"
    data:
      {}
    validation:
      - contains:
          code: 0
  - case_name: "分组列表：时间字段格式"
    headers:
      token: "${token}"
    data:
      {}
    validation:
      - contains:
          code: 0
  - case_name: "分组列表：未登录"
    data:
      {}
    validation:
      - contains:
          code: 250004
