# 商用短链平台 · stats 域 —— POST /data-server/api/visit_stats/v1/frequent_source
#
# 契约速记：成功 code=0、msg=null；失败也是 HTTP 200，成败只看 code。
# 由 Excel 用例表转换而来，原始表见项目 docs/。
base_info:
  api_name: stats-frequent_source
  url: '/data-server/api/visit_stats/v1/frequent_source'
  method: POST
  headers:
    'Content-Type': 'application/json'

test_cases:
  - case_name: "高频来源：正常查询"
    skip: "待补：需要一条真短链的 code —— 当前 data.code 是字面量 <code>，查询返回空数据"
    headers:
      token: "${token}"
    data:
      code: "<code>"
      startTime: "20261005"
      endTime: "20261005"
    validation:
      - contains:
          code: 0
  - case_name: "高频来源：缺 code"
    headers:
      token: "${token}"
    data:
      startTime: "20261005"
      endTime: "20261005"
    validation:
      - contains:
          code: 110003
  - case_name: "高频来源：跨度 31 天"
    headers:
      token: "${token}"
    data:
      code: "<code>"
      startTime: "20260904"
      endTime: "20261005"
    validation:
      - contains:
          code: 400002
