# 商用短链平台 · stats 域 —— POST /data-server/api/visit_stats/v1/trend
#
# 契约速记：成功 code=0、msg=null；失败也是 HTTP 200，成败只看 code。
# 由 Excel 用例表转换而来，原始表见项目 docs/。
base_info:
  api_name: stats-trend
  url: '/data-server/api/visit_stats/v1/trend'
  method: POST
  headers:
    'Content-Type': 'application/json'

test_cases:
  - case_name: "访问趋势：DAY 粒度（跨天）"
    headers:
      token: "${token}"
    data:
      code: "<code>"
      type: "DAY"
      startTime: "20261005"
      endTime: "20261005"
    validation:
      - contains:
          code: 0
  - case_name: "访问趋势：HOUR 粒度（不传 endTime）"
    headers:
      token: "${token}"
    data:
      code: "<code>"
      type: "HOUR"
      startTime: "20261005"
    validation:
      - contains:
          code: 0
  - case_name: "访问趋势：MINUTE 粒度（yyyyMMddHHmmss）"
    headers:
      token: "${token}"
    data:
      code: "<code>"
      type: "MINUTE"
      startTime: "20261005000000"
      endTime: "20261005235959"
    validation:
      - contains:
          code: 0
  - case_name: "访问趋势：HOUR 却硬带超跨度的 endTime"
    headers:
      token: "${token}"
    data:
      code: "<code>"
      type: "HOUR"
      startTime: "20260904"
      endTime: "20261005"
    validation:
      - contains:
          code: 400002
  - case_name: "访问趋势：粒度非法（YEAR）"
    headers:
      token: "${token}"
    data:
      code: "<code>"
      type: "YEAR"
      startTime: "20261005"
      endTime: "20261005"
    validation:
      - contains:
          code: 110003
  - case_name: "访问趋势：粒度小写（day）"
    headers:
      token: "${token}"
    data:
      code: "<code>"
      type: "day"
      startTime: "20261005"
      endTime: "20261005"
    validation:
      - contains:
          code: 0
  - case_name: "访问趋势：缺 type"
    headers:
      token: "${token}"
    data:
      code: "<code>"
      startTime: "20261005"
      endTime: "20261005"
    validation:
      - contains:
          code: 110003
  - case_name: "访问趋势：未登录"
    data:
      code: "<code>"
      type: "DAY"
      startTime: "20261005"
      endTime: "20261005"
    validation:
      - contains:
          code: 250004
  - case_name: "数据正确性：趋势曲线与跳转分布一致"
    skip: "待补：需要一条真短链的 code —— 当前 data.code 是字面量 <code>，查询返回空数据"
    headers:
      token: "${token}"
    data:
      code: "<code>"
      type: "HOUR"
      startTime: "20261005"
    validation:
      - contains:
          code: 0
