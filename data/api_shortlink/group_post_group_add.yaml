# 商用短链平台 · group 域 —— POST /link-server/api/group/v1/add
#
# 契约速记：成功 code=0、msg=null；失败也是 HTTP 200，成败只看 code。
#
# ⚠️ 「重名判重」那几条（同账号重名 / 尾随空格 / 大小写不同 / 同名竞态）**已移进
#    `data/scenarios/group_duplicate_name.yaml`** —— 判重必须对「**已存在的组**」再建
#    才验得出来，而单接口一条用例只能发一个请求、表达不了"先有个组"这个前提；
#    硬靠用例执行顺序又不可靠（pytest 的顺序不保证）。
#
# ⚠️ 下面"建成功"的那批（特殊字符 / 超长 / 注入串…）**曾经挂着 xfail**，理由是
#    "分组是物理删除、跑完不清理，第二遍必撞车"。加了 `cleanup_test_data`（快照差集
#    清理）之后它们真能过了，xfail 已摘。
base_info:
  api_name: group-add
  url: '/link-server/api/group/v1/add'
  method: POST
  headers:
    'Content-Type': 'application/json'

test_cases:
  - case_name: "创建分组：正常创建（基准）"
    smoke: true
    headers:
      token: "${token}"
    data:
      title: "g1_auto_${timestamp()}"
    validation:
      - contains:
          code: 0
  - case_name: "创建分组：不同账号可以同名"
    xfail: "缺测试账号：需要第二个账号才能验跨账号同名（测试环境未提供）"
    headers:
      token: "${token_b}"
    data:
      title: "g1"
    validation:
      - contains:
          code: 0
  - case_name: "创建分组：title 空字符串"
    headers:
      token: "${token}"
    data:
      title: ""
    validation:
      - contains:
          code: 110003
  - case_name: "创建分组：title 全空格"
    headers:
      token: "${token}"
    data:
      title: "   "
    validation:
      - contains:
          code: 110003
  - case_name: "创建分组：缺 title 字段"
    headers:
      token: "${token}"
    data:
      {}
    validation:
      - contains:
          code: 110003
  - case_name: "创建分组：title 显式传 null"
    headers:
      token: "${token}"
    data:
      title: null
    validation:
      - contains:
          code: 110003
  - case_name: "创建分组：title 传数组"
    headers:
      token: "${token}"
    data:
      title: ["g1"]
    validation:
      - contains:
          code: 110003
  - case_name: "创建分组：title 传 number"

    headers:
      token: "${token}"
    data:
      title: 123
    validation:
      - contains:
          code: 0
  - case_name: "创建分组：空请求体"
    headers:
      token: "${token}"
    data:
      {}
    validation:
      - contains:
          code: 110003
  - case_name: "创建分组：title 长度 1（最内边界）"
    headers:
      token: "${token}"
    data:
      title: "a_${timestamp()}"
    validation:
      - contains:
          code: 0
  - case_name: "创建分组：title 长度 255（表上限，边界内）"

    headers:
      token: "${token}"
    data:
      title: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    validation:
      - contains:
          code: 0
  - case_name: "创建分组：title 长度 256（超上限 1 字节）"
    xfail: "已知缺陷：超长漏到数据库层，返回 -1（应为 110003）"
    headers:
      token: "${token}"
    data:
      title: "yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy"
    validation:
      - contains:
          code: 110003
  - case_name: "创建分组：title 含中文与 emoji"

    headers:
      token: "${token}"
    data:
      title: "推广😀组"
    validation:
      - contains:
          code: 0
  - case_name: "创建分组：未登录（不带 token）"
    data:
      title: "nologin"
    validation:
      - contains:
          code: 250004
  - case_name: "创建分组：伪造 token"
    headers:
      token: "dcloud-link.fake.fake.fake"
    data:
      title: "fake"
    validation:
      - contains:
          code: 250004
  - case_name: "创建分组：成功响应体结构"
    headers:
      token: "${token}"
    data:
      title: "resp_auto_${timestamp()}"
    validation:
      - contains:
          code: 0
  - case_name: "安全-SQL注入：title 万能密码"

    headers:
      token: "${token}"
    data:
      title: "' OR '1'='1"
    validation:
      - contains:
          code: 0
  - case_name: "安全-SQL注入：title 联合查询"

    headers:
      token: "${token}"
    data:
      title: "' UNION SELECT 1,2,3,4,5 -- "
    validation:
      - contains:
          code: 0
  - case_name: "安全-SQL注入：title DDL 注入"

    headers:
      token: "${token}"
    data:
      title: "1'; DROP TABLE not_exist_tbl; -- "
    validation:
      - contains:
          code: 0
  - case_name: "安全-XSS：title 含 script 标签"

    headers:
      token: "${token}"
    data:
      title: "<script>alert(1)</script>"
    validation:
      - contains:
          code: 0
  - case_name: "安全-XSS：title 含 img onerror"

    headers:
      token: "${token}"
    data:
      title: "\"><img src=x onerror=alert(1)>"
    validation:
      - contains:
          code: 0
  - case_name: "特殊字符：title 前导空格"

    headers:
      token: "${token}"
    data:
      title: " g1"
    validation:
      - contains:
          code: 0
  - case_name: "特殊字符：title 首尾都有空格"

    headers:
      token: "${token}"
    data:
      title: "  g1  "
    validation:
      - contains:
          code: 0
  - case_name: "特殊字符：title 含换行与制表符"

    headers:
      token: "${token}"
    data:
      title: "a\nb\tc"
    validation:
      - contains:
          code: 0
  - case_name: "特殊字符：title 含 NUL（\\u0000）"

    headers:
      token: "${token}"
    data:
      title: "a\u0000b"
    validation:
      - contains:
          code: 0
  - case_name: "特殊字符：title 为通配符 % 和 _"

    headers:
      token: "${token}"
    data:
      title: "%_%"
    validation:
      - contains:
          code: 0
  - case_name: "超长：title 为 255 个 emoji（4 字节/字符）"

    headers:
      token: "${token}"
    data:
      title: "😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀😀"
    validation:
      - contains:
          code: 0
  - case_name: "协议层：Content-Type 改为 text/plain"
    xfail: "已知缺陷：返回 -1（应为 110003）"
    headers:
      Content-Type: "text/plain"
      token: "${token}"
    data:
      title: "ct"
    validation:
      - contains:
          code: 110003
