# 商用短链平台 · link 域 —— POST /link-server/api/link/v1/page
#
# 契约速记：成功 code=0、msg=null；失败也是 HTTP 200，成败只看 code。
# 由 Excel 用例表转换而来，原始表见项目 docs/。
base_info:
  api_name: link-page
  url: '/link-server/api/link/v1/page'
  method: POST
  headers:
    'Content-Type': 'application/json'

test_cases:
  - case_name: "建链：MQ 消费后可在列表查到"
    headers:
      token: "${token}"
    data:
      page: 1
      size: 10
    validation:
      - contains:
          code: 0
  - case_name: "分页：正常查询"
    smoke: true
    headers:
      token: "${token}"
    data:
      page: 1
      size: 10
    validation:
      - contains:
          code: 0
  - case_name: "分页：空结果"
    headers:
      token: "${token}"
    data:
      groupId: "999999999999"
      page: 1
      size: 10
    validation:
      - contains:
          code: 0
  - case_name: "分页：groupId 为空则查全部"
    headers:
      token: "${token}"
    data:
      page: 1
      size: 10
    validation:
      - contains:
          code: 0
  - case_name: "分页：Long 字段序列化为字符串"
    headers:
      token: "${token}"
    data:
      page: 1
      size: 10
    validation:
      - contains:
          code: 0
  - case_name: "分页：page=0（下界外）"
    headers:
      token: "${token}"
    data:
      page: 0
      size: 10
    validation:
      - contains:
          code: 0
  - case_name: "分页：size=0（下界外）"
    headers:
      token: "${token}"
    data:
      page: 1
      size: 0
    validation:
      - contains:
          code: 0
  - case_name: "分页：size 极大（10000）"
    headers:
      token: "${token}"
    data:
      page: 1
      size: 10000
    validation:
      - contains:
          code: 0
  - case_name: "分页：未登录"
    data:
      page: 1
      size: 10
    validation:
      - contains:
          code: 250004
