# 商用短链平台 · group 域 —— GET /link-server/api/group/v1/detail/{groupId}
#
# 契约速记：成功 code=0、msg=null；失败也是 HTTP 200，成败只看 code。
# 由 Excel 用例表转换而来，原始表见项目 docs/。
# 路径参数 {groupId} 由每条用例的 path_params 填。
base_info:
  api_name: group-{groupId}
  url: '/link-server/api/group/v1/detail/{groupId}'
  method: GET
  headers:
    'Content-Type': 'application/json'

test_cases:
  - case_name: "分组详情：查自己的分组"
    smoke: true
    headers:
      token: "${token}"
    path_params:
      groupId: "${g1_id}"
    data:
      {}
    validation:
      - contains:
          code: 0
  - case_name: "分组详情：越权查他人分组"
    xfail: "缺测试账号：需要第二个账号才能验越权（测试环境未提供）"
    headers:
      token: "${token_b}"
    path_params:
      groupId: "${g1_id}"
    data:
      {}
    validation:
      - contains:
          code: 23404
  - case_name: "分组详情：不存在的 id"
    headers:
      token: "${token}"
    path_params:
      groupId: "999999999999"
    data:
      {}
    validation:
      - contains:
          code: 23404
  - case_name: "分组详情：id=0"
    headers:
      token: "${token}"
    path_params:
      groupId: "0"
    data:
      {}
    validation:
      - contains:
          code: 23404
  - case_name: "分组详情：id 为负数"
    headers:
      token: "${token}"
    path_params:
      groupId: "-1"
    data:
      {}
    validation:
      - contains:
          code: 23404
  - case_name: "分组详情：id 非数字"
    xfail: "已知缺陷：路径参数类型错误未兜住，返回 -1（应为 110003）"
    headers:
      token: "${token}"
    path_params:
      groupId: "abc"
    data:
      {}
    validation:
      - contains:
          code: 110003
  - case_name: "分组详情：id 超出 bigint 范围"
    xfail: "已知缺陷：同「id 非数字」，返回 -1（应为 110003）"
    headers:
      token: "${token}"
    path_params:
      groupId: "99999999999999999999"
    data:
      {}
    validation:
      - contains:
          code: 110003
  - case_name: "分组详情：未登录"
    path_params:
      groupId: "${g1_id}"
    data:
      {}
    validation:
      - contains:
          code: 250004
  - case_name: "安全-SQL注入：路径参数 id 传注入串"
    xfail: "已知缺陷：返回 -1（应为 110003）"
    headers:
      token: "${token}"
    path_params:
      groupId: "' OR '1'='1"
    data:
      {}
    validation:
      - contains:
          code: 110003
