# 商用短链平台 · link 域 —— POST /link-server/api/link/v1/add
#
# 契约速记：成功 code=0、msg=null；失败也是 HTTP 200，成败只看 code。
# 由 Excel 用例表转换而来，原始表见项目 docs/。
base_info:
  api_name: link-add
  url: '/link-server/api/link/v1/add'
  method: POST
  headers:
    'Content-Type': 'application/json'

test_cases:
  - case_name: "建链：正常建链（异步受理）"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      originalUrl: "https://www.baidu.com"
      domainId: "1"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 0
  - case_name: "建链：缺 groupId"
    headers:
      token: "${token}"
    data:
      title: "测试链接"
      originalUrl: "https://www.baidu.com"
      domainId: "1"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 110003
  - case_name: "建链：缺 originalUrl"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      domainId: "1"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 110003
  - case_name: "建链：originalUrl 空字符串"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      originalUrl: ""
      domainId: "1"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 110003
  - case_name: "建链：缺 domainId"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      originalUrl: "https://www.baidu.com"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 110003
  - case_name: "建链：缺 domainType"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      originalUrl: "https://www.baidu.com"
      domainId: "1"
    validation:
      - contains:
          code: 110003
  - case_name: "建链：title 长度 128（边界内）"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "tttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttt"
      originalUrl: "https://www.baidu.com"
      domainId: "1"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 0
  - case_name: "建链：title 长度 129（超上限）"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "ttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttt"
      originalUrl: "https://www.baidu.com"
      domainId: "1"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 110003
  - case_name: "建链：expired 为空（默认永久）"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      originalUrl: "https://www.baidu.com"
      domainId: "1"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 0
  - case_name: "建链：expired 合法格式"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      originalUrl: "https://www.baidu.com"
      domainId: "1"
      domainType: "OFFICIAL"
      expired: "2027-12-31 23:59:59"
    validation:
      - contains:
          code: 0
  - case_name: "建链：expired 格式非法"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      originalUrl: "https://www.baidu.com"
      domainId: "1"
      domainType: "OFFICIAL"
      expired: "2027/12/31"
    validation:
      - contains:
          code: 110003
  - case_name: "建链：groupId 不存在"
    headers:
      token: "${token}"
    data:
      groupId: "999999999999"
      title: "测试链接"
      originalUrl: "https://www.baidu.com"
      domainId: "1"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 23404
  - case_name: "建链：groupId 属于他人（越权）"
    headers:
      token: "${token_b}"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      originalUrl: "https://www.baidu.com"
      domainId: "1"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 23404
  - case_name: "建链：domainId 不存在"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      originalUrl: "https://www.baidu.com"
      domainId: "999999999999"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 260401
  - case_name: "建链：domainType 与 domainId 不匹配"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      originalUrl: "https://www.baidu.com"
      domainId: "1"
      domainType: "CUSTOM"
    validation:
      - contains:
          code: 260401
  - case_name: "建链：未登录"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      originalUrl: "https://www.baidu.com"
      domainId: "1"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 250004
  - case_name: "建链：非幂等，同一长链建两次得两个码"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      originalUrl: "https://www.baidu.com"
      domainId: "1"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 0
  - case_name: "建链：扣减流量（副作用验证）"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      originalUrl: "https://traffic-probe.example.com"
      domainId: "1"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 0
  - case_name: "建链：流量耗尽时应被拒"
    headers:
      token: "${token}"
    data:
      groupId: "<g1_id>"
      title: "测试链接"
      originalUrl: "https://www.baidu.com"
      domainId: "1"
      domainType: "OFFICIAL"
    validation:
      - contains:
          code: 600102
