base_info:
  api_name: 用户登录
  url: '/dar/user/login'
  method: POST
  headers:
    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'

test_cases:
  - case_name: 用户名密码正确登录
    data:
      user_name: test01
      passwd: admin123
    validation:
      - contains:
          msg: 登录成功
      - contains:
          msg_code: 200
    # 提取出来给后续接口用：${token} 就能取到
    extract:
      token: $.token
      user_id: $.userId

  - case_name: 密码错误
    data:
      user_name: test01
      passwd: wrong
    validation:
      - contains:
          msg: 登录失败,用户名或密码错误
      - contains:
          msg_code: 9001

  - case_name: 账号不存在
    data:
      user_name: nobody
      passwd: admin123
    validation:
      - contains:
          msg: 登录失败,用户名或密码错误
      - contains:
          msg_code: 9001

  - case_name: 密码为空
    data:
      user_name: test01
      passwd: ""
    validation:
      - contains:
          msg: 参数错误
      - contains:
          msg_code: -1
