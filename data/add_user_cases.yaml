base_info:
  api_name: 新增用户
  url: '/dar/user/addUser'
  method: POST
  headers:
    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'

test_cases:
  - case_name: 正常token
    data:
      user_name: new01
    token_type: valid
    validation:
      - contains:
          msg: 新增成功
      - contains:
          msg_code: 200

  - case_name: 错误token
    data:
      user_name: new01
    token_type: invalid
    validation:
      - contains:
          msg: 新增失败，参数缺失或token失效
      - contains:
          msg_code: 9001

  - case_name: 过期token
    data:
      user_name: new01
    token_type: expired
    validation:
      - contains:
          msg: 新增失败，参数缺失或token失效
      - contains:
          msg_code: 9001

  - case_name: 缺失token
    data:
      user_name: new01
    token_type: missing
    validation:
      - contains:
          msg: 新增失败，参数缺失或token失效
      - contains:
          msg_code: 9001
