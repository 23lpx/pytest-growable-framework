base_info:
  api_name: 用户查询
  url: '/dar/user/queryUser'
  method: POST
  headers:
    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'

# 同 deleteUser：只看 user_id、不要 token，成功/失败都走 HTTP 200，靠 msg_code 分辨。
test_cases:
  - case_name: 查询用户成功
    data:
      user_id: 123839387391912
    validation:
      - contains:
          msg: 查询成功!
      - contains:
          msg_code: 200

  - case_name: 缺少必填参数 user_id
    data: {}
    validation:
      - contains:
          msg: 查询失败，用户id不存在!
      - contains:
          msg_code: 9001

  - case_name: 传 username 而非 user_id（参数名不对）
    data:
      username: testadduser
    validation:
      - contains:
          msg: 查询失败，用户id不存在!
      - contains:
          msg_code: 9001
