[pytest]
testpaths = testcase
python_files = test_*.py

# test_ 必须留着：testcase/test_/ 是归档的旧用例，里面 import 是断的，
# 被收进来会让整轮 collection error。
# 其余条目是**补回 pytest 的默认值** —— 只写一个 test_ 会把默认值整个顶掉，
# 那样 .venv / .* / *.egg 都不再排除，容易把三方库自带的测试收进来。
norecursedirs = test_ *.egg .* venv build dist __pycache__

addopts = -v -s

markers =
    smoke: 冒烟用例，提交代码后必跑
    regression: 回归用例，发版前跑

# 框架自身的单元测试在 tests/，不依赖被测服务，单独跑：
#     ./.venv/Scripts/python.exe -m pytest tests/
# 它不在 testpaths 里，所以裸跑 pytest 不会带上它。
