[pytest]
testpaths = cases
python_files = test_*.py

# src-layout：pytest 启动时把 src 塞进 sys.path ——
# 这样 clone 下来直接 pytest 就能跑，不依赖有没有执行过 pip install -e .
# （两种方式不冲突：装了就用装的，没装也能跑）
pythonpath = src

# test_ 必须留着：cases/test_/ 是归档的旧用例，里面 import 是断的，
# 被收进来会让整轮 collection error。
# 其余条目是**补回 pytest 的默认值** —— 只写一个 test_ 会把默认值整个顶掉，
# 那样 .venv / .* / *.egg 都不再排除，容易把三方库自带的测试收进来。
norecursedirs = test_ *.egg .* venv build dist __pycache__

# -v 每条用例一行；**不加 -s** —— 让 pytest 捕获用例期间的输出，
# 这样控制台不会被执行日志刷屏，失败时它会在「Captured log」里把该用例的日志还给你。
# 想看实时日志再手动加 -s。
addopts = -v

# 让参数化 id 里的中文正常显示。不加这条，[用户名密码正确登录] 会显示成
# [用户名密码正确登录] 这种转义。
# 选项名长得很怪，是 pytest 官方的警告式命名 —— 认准它就行了。
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

markers =
    smoke: 冒烟用例，提交代码后必跑
    regression: 回归用例，发版前跑

# 框架自身的单元测试在 tests/，不依赖被测服务，单独跑：
#     ./.venv/Scripts/python.exe -m pytest tests/
# 它不在 testpaths 里，所以裸跑 pytest 不会带上它。
